<svg xmlns="http://www.w3.org/2000/svg"
     width="360"
     height="360"
     viewBox="0 0 360 360"
     fill="none"
     role="img"
     aria-labelledby="ozcraft-icon-title ozcraft-icon-desc">

  <title id="ozcraft-icon-title">OzCraft Icon</title>
  <desc id="ozcraft-icon-desc">
    OzCraft yapay zeka destekli CV platformu için yazısız logo ikonu.
  </desc>

  <defs>
    <linearGradient id="brandGradient"
                    x1="70"
                    y1="55"
                    x2="330"
                    y2="305"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1EA7FD"/>
      <stop offset="0.48" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>

    <linearGradient id="paperGradient"
                    x1="115"
                    y1="85"
                    x2="260"
                    y2="255"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF4FF"/>
    </linearGradient>

    <filter id="softShadow"
            x="-30%"
            y="-30%"
            width="160%"
            height="160%">
      <feDropShadow dx="0"
                    dy="8"
                    stdDeviation="10"
                    flood-color="#172554"
                    flood-opacity="0.14"/>
    </filter>
  </defs>

  <g id="ozcraft-icon"
     transform="translate(0 0)"
     filter="url(#softShadow)">

    <!-- Background -->
    <g id="icon-background">
      <rect x="58"
            y="52"
            width="244"
            height="244"
            rx="56"
            fill="url(#brandGradient)"/>

      <path d="M84 265
               C127 301 222 311 300 241"
            stroke="#5B5CF6"
            stroke-width="19"
            stroke-linecap="round"
            opacity="0.45"/>
    </g>

    <!-- CV / Resume Document -->
    <g id="resume-document">
      <path d="M108 105
               C108 91 119 80 133 80
               H220
               L265 125
               V231
               C265 246 253 258 238 258
               H133
               C119 258 108 247 108 233
               Z"
            fill="url(#paperGradient)"/>

      <!-- Fold -->
      <path d="M220 80
               V117
               C220 127 228 135 238 135
               H265
               Z"
            fill="#DCE6FF"/>

      <!-- Profile -->
      <circle cx="158"
              cy="140"
              r="19"
              fill="#2563EB"/>

      <path d="M127 189
               C129 165 141 155 158 155
               C176 155 188 165 190 189
               Z"
            fill="#2563EB"/>

      <!-- Resume Lines -->
      <rect x="126"
            y="205"
            width="103"
            height="13"
            rx="6.5"
            fill="#2563EB"/>

      <rect x="126"
            y="228"
            width="80"
            height="13"
            rx="6.5"
            fill="#4478EE"/>
    </g>

    <!-- Growth Arrow -->
    <g id="growth-arrow">
      <path d="M86 267
               C133 294 209 293 252 246
               C269 228 280 205 285 181"
            stroke="url(#brandGradient)"
            stroke-width="17"
            stroke-linecap="round"/>

      <path d="M267 187
               L291 161
               L302 194"
            stroke="#5B3FF2"
            stroke-width="17"
            stroke-linecap="round"
            stroke-linejoin="round"/>
    </g>

    <!-- AI Sparkles -->
    <g id="ai-sparkles">
      <path d="M278 59
               C281 74 289 82 305 86
               C289 89 281 98 278 113
               C275 98 267 89 251 86
               C267 82 275 74 278 59Z"
            fill="#7C3AED"/>

      <path d="M320 95
               C322 105 328 111 338 113
               C328 116 322 122 320 132
               C317 122 312 116 302 113
               C312 111 317 105 320 95Z"
            fill="#25B7F7"/>
    </g>

  </g>
</svg>