name: CI/CD - Build, Push & Deploy

on:
  push:
    branches:
      - main
      - rifki
  workflow_dispatch:

env:
  DEFAULT_IMAGE_NAME: rifkikesepara/resume-builder

jobs:
  # ============================================================================
  # Job 1: Build Docker Image & Push to Docker Hub
  # ============================================================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Docker Image Name
        id: image-meta
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "image=${{ secrets.DOCKERHUB_USERNAME }}/resume-builder" >> $GITHUB_OUTPUT
          else
            echo "image=${{ env.DEFAULT_IMAGE_NAME }}" >> $GITHUB_OUTPUT
          fi

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-meta.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Job 2: Deploy to Self-Hosted Server Runner via Docker Compose
  # ============================================================================
  deploy:
    name: Deploy to Self-Hosted Runner
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Docker Image Name
        id: deploy-meta
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/resume-builder:latest" >> $GITHUB_ENV
          else
            echo "IMAGE_NAME=${{ env.DEFAULT_IMAGE_NAME }}:latest" >> $GITHUB_ENV
          fi

      - name: Log in to Docker Hub on Runner
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          fi

      - name: Pull latest image from Docker Hub
        run: docker compose pull

      - name: Run container via Docker Compose
        run: docker compose up -d --remove-orphans

      - name: Clean up unused / dangling images
        run: docker image prune -f
